frr version 10.7.1_git
frr defaults traditional
hostname r1
log stdout
service integrated-vtysh-config
!
interface eth4
 ip ospf passive
exit
!
interface eth2
 no ip ospf passive
exit
!
interface eth3
 no ip ospf passive
exit
!
router ospf
 ospf router-id 1.1.1.1
 passive-interface default
 network 172.16.2.0/24 area 0
 network 203.0.113.0/29 area 0
exit
!
